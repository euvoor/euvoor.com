<VirtualHost *:80>
    ServerName euvoor.test
    Redirect permanent / https://euvoor.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName euvoor.test
    SSLEngine on
    SSLCertificateFile /data/dev/euvoor.com/.local/tls/euvoor.test.pem
    SSLCertificateKeyFile /data/dev/euvoor.com/.local/tls/euvoor.test-key.pem
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:4817/
    ProxyPassReverse / http://127.0.0.1:4817/
    <Location />
        Require local
    </Location>
</VirtualHost>
